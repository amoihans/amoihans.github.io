<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- ===== 头部 ===== -->
  <!-- 头部轮廓 (白底) -->
  <ellipse cx="200" cy="205" rx="140" ry="130" fill="#fafafa" stroke="#222" stroke-width="3"/>

  <!-- 头部黑色斑块: 右眼周围 -->
  <path d="M230,100 Q310,90 330,160 Q340,200 300,230 Q260,260 240,230 Q220,190 230,140Z" fill="#222"/>

  <!-- 头部黑色斑块: 左耳根 -->
  <path d="M70,130 Q50,70 100,55 Q105,90 90,120Z" fill="#222"/>

  <!-- 额头倒V斑纹 -->
  <path d="M185,80 Q200,50 215,80 Q210,110 200,125 Q190,110 185,80Z" fill="#222"/>

  <!-- 左耳 -->
  <polygon points="85,145 45,20 150,90" fill="#222" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="92,125 62,45 138,92" fill="#ffb8c6"/>

  <!-- 右耳 -->
  <polygon points="315,145 355,20 250,90" fill="#222" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="308,125 338,45 262,92" fill="#ffb8c6"/>

  <!-- 左眼 -->
  <ellipse cx="140" cy="190" rx="28" ry="30" fill="white" stroke="#222" stroke-width="3"/>
  <ellipse cx="146" cy="190" rx="16" ry="18" fill="#2d1b0e"/>
  <ellipse cx="152" cy="181" rx="7" ry="5" fill="white"/>

  <!-- 右眼 (在黑色斑块上) -->
  <ellipse cx="265" cy="190" rx="28" ry="30" fill="white" stroke="#222" stroke-width="3"/>
  <ellipse cx="259" cy="190" rx="16" ry="18" fill="#2d1b0e"/>
  <ellipse cx="265" cy="181" rx="7" ry="5" fill="white"/>

  <!-- 鼻子 -->
  <ellipse cx="200" cy="238" rx="12" ry="9" fill="#ff8c94"/>

  <!-- 嘴巴 -->
  <path d="M200,247 Q200,265 180,272" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M200,247 Q200,265 220,272" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 左胡须 -->
  <line x1="110" y1="225" x2="30" y2="215" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="108" y1="240" x2="25" y2="242" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="112" y1="255" x2="33" y2="270" stroke="#222" stroke-width="2" stroke-linecap="round"/>

  <!-- 右胡须 -->
  <line x1="290" y1="225" x2="370" y2="215" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="292" y1="240" x2="375" y2="242" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="288" y1="255" x2="367" y2="270" stroke="#222" stroke-width="2" stroke-linecap="round"/>

  <!-- 腮红 -->
  <ellipse cx="100" cy="242" rx="20" ry="11" fill="#ffb8c6" opacity="0.4"/>
  <ellipse cx="300" cy="242" rx="20" ry="11" fill="#ffb8c6" opacity="0.4"/>

  <!-- ===== 项圈 + 铃铛 ===== -->
  <!-- 红色项圈 -->
  <path d="M135,315 Q200,340 265,315" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
  <!-- 金色铃铛 -->
  <circle cx="200" cy="336" r="16" fill="#fbbf24" stroke="#d97706" stroke-width="2.5"/>
  <line x1="200" y1="319" x2="200" y2="324" stroke="#d97706" stroke-width="2.5"/>
  <circle cx="200" cy="347" r="2.5" fill="#d97706"/>
  <!-- 铃铛高光 -->
  <ellipse cx="194" cy="331" rx="4" ry="3" fill="#fef3c7" opacity="0.6"/>

  <!-- ===== 招财左爪 ===== -->
  <!-- 左臂从头部左侧下方伸出，举起 -->
  <path d="M95,290 Q60,260 55,210 Q52,178 70,165" fill="none" stroke="#222" stroke-width="34" stroke-linecap="round"/>
  <path d="M95,290 Q60,260 55,210 Q52,178 70,165" fill="none" stroke="#fafafa" stroke-width="28" stroke-linecap="round"/>
  <!-- 爪垫底 -->
  <ellipse cx="68" cy="162" rx="20" ry="16" fill="#fafafa" stroke="#222" stroke-width="3"/>
  <!-- 主肉球 -->
  <ellipse cx="68" cy="158" rx="10" ry="7" fill="#ffb8c6"/>
  <!-- 趾垫 -->
  <circle cx="54" cy="150" r="5" fill="#ffb8c6"/>
  <circle cx="68" cy="146" r="5" fill="#ffb8c6"/>
  <circle cx="82" cy="150" r="5" fill="#ffb8c6"/>

  <!-- 招财手势线 -->
  <g transform="translate(30,115)" opacity="0.35">
    <path d="M0,0 Q8,-12 16,0" fill="none" stroke="#ff8c94" stroke-width="2" stroke-linecap="round"/>
    <path d="M5,8 Q13,-4 21,8" fill="none" stroke="#ff8c94" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
