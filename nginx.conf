user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # 日志
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # gzip 压缩（wasm 已经是压缩格式，但 .js / .html / .svg / .css 受益）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/wasm
        application/rss+xml
        image/svg+xml;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # ── 通用安全头 ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Godot Web 跨源隔离头（必须） ──
        # Godot 4 启用 SharedArrayBuffer 需要 COOP/COEP
        # 仅对 games 路径生效，不影响博客其他页面
        # 否则会报 "The following features required to run Godot projects on the Web are missing"
        location /games/ {
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Cross-Origin-Embedder-Policy "require-corp" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;

            # 缓存策略：HTML 短缓存（便于更新），wasm/pck 长缓存
            location ~* \.html$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600" always;
            }
            location ~* \.(wasm|pck)$ {
                expires 30d;
                add_header Cache-Control "public, max-age=2592000, immutable" always;
            }
            location ~* \.(js|png|jpg|jpeg|svg|ico|webp)$ {
                expires 7d;
                add_header Cache-Control "public, max-age=604800" always;
            }

            try_files $uri $uri/ =404;
        }

        # ── 静态资源长缓存（哈希文件名所以可以 immutable） ──
        location /_astro/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # ── 默认：博客页面，HTML 短缓存 ──
        location / {
            location ~* \.html$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600" always;
            }
            try_files $uri $uri/ $uri.html =404;
        }

        # 404 fallback
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
